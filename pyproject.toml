[project]
name = "lechonk"
version = "0.1.0"
description = "Le Chonk Plays Freeciv: LLM harness for Freeciv via the vendored CivRealm stack"
requires-python = ">=3.12"
# Licensing posture (design-plan-freeciv-v1.1.md decision 7): the repo as
# distributed is a combined work under GPL-3.0-or-later. lechonk.core and the
# other CivRealm-free modules are MIT (SPDX headers in-file); lechonk.adapter
# is the ONLY package that imports civrealm and is GPL-3.0-or-later.
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.7",
    "mistralai>=3.4.0,<4",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lechonk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
